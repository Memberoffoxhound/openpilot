<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>SEXYPILOT</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/icon.svg"/>
  <link rel="apple-touch-icon" href="/icon.svg"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/app.css?v=12"/>
</head>
<body>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-head">
      <span class="wordmark">SEXYPILOT</span>
      <button type="button" id="drawerClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <nav>
      <button type="button" data-page="home">Home</button>
      <button type="button" data-page="settings">Settings</button>
      <button type="button" data-page="live">Live</button>
      <button type="button" data-page="grok">Voice</button>
      <button type="button" data-page="shots">Screenshots</button>
    </nav>
    <p class="drawer-foot" id="drawerFoot"></p>
  </aside>

  <header class="top">
    <button type="button" id="menuBtn" class="icon-btn" aria-label="Menu">
      <span class="burger"></span>
    </button>
    <div class="brand">
      <div class="wordmark">SEXYPILOT</div>
      <div class="clock" id="clock">—</div>
    </div>
    <div class="hdr-stats" id="hdrStats">
      <span><em>TODAY</em> —</span>
      <span><em>WEEK</em> —</span>
      <span><em>CPU</em>—</span>
      <span><em>MEM</em>—</span>
    </div>
  </header>

  <main id="page"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js" defer></script>
  <script src="/app.js?v=12" defer></script>
</body>
</html>
