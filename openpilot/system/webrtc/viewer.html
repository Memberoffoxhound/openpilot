<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>DELAMAIN Live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  video { background: #000; }
  #vWide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #vDriver {
    position: absolute; right: max(12px, env(safe-area-inset-right));
    bottom: calc(72px + env(safe-area-inset-bottom));
    width: min(34vw, 220px); aspect-ratio: 4/3; object-fit: cover;
    border-radius: 14px; border: 2px solid rgba(255,255,255,.22);
    box-shadow: 0 10px 32px rgba(0,0,0,.55);
  }
  #vRoad { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  body.mode-3d #vWide, body.mode-3d #vDriver { opacity: 0; pointer-events: none; }
  body.mode-3d #gl { display: block; }
  #bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: linear-gradient(#000c, #0000); font-size: 13px; letter-spacing: .08em;
  }
  #bar b { font-weight: 700; letter-spacing: .18em; }
  #bar .sp { flex: 1; }
  #bar .st { opacity: .7; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
  #modes {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center; gap: 10px;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(#0000, #000c);
  }
  button {
    appearance: none; border: 1px solid #ffffff2a; background: #141414cc;
    color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 15px;
    backdrop-filter: blur(8px);
  }
  button.on { background: #3e8ceb; border-color: #3e8ceb; color: #fff; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; opacity: .45; pointer-events: none; display: none; }
  body.mode-3d #hint { display: block; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; z-index: 6; background: #000a; }
  #err.show { display: grid; }
</style>
</head>
<body class="mode-pip">
<div id="stage">
  <video id="vWide" playsinline webkit-playsinline muted autoplay></video>
  <video id="vDriver" playsinline webkit-playsinline muted autoplay></video>
  <video id="vRoad" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
</div>
<div id="bar"><b>DELAMAIN</b><span class="sp"></span><span class="st" id="st">starting…</span></div>
<div id="hint">drag to look · pinch to zoom · look back for driver</div>
<div id="modes">
  <button id="btnPip" class="on">PiP</button>
  <button id="btn3d">3D</button>
</div>
<div id="err"></div>
<script>
const WIDE_HFOV = 60 * Math.PI/180;
const ROAD_HFOV = 30 * Math.PI/180;
const DRIVER_HFOV = 90 * Math.PI/180;

const $ = (id) => document.getElementById(id);
const st = $("st");
const errBox = $("err");
function status(t) { st.textContent = t; }
function showErr(t) { errBox.textContent = t; errBox.classList.add("show"); }

async function watch() {
  const r = await fetch("/watch", { method: "POST" });
  if (!r.ok) throw new Error(await r.text() || r.statusText);
}

function attach(video, cam) {
  video.src = "/hls/" + cam + ".m3u8?t=" + Date.now();
  video.muted = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  const play = () => video.play().catch(() => {});
  video.addEventListener("canplay", play, { once: true });
  play();
}

let mode = "pip";
$("btnPip").onclick = () => setMode("pip");
$("btn3d").onclick = () => setMode("3d");

function setMode(m) {
  mode = m;
  document.body.classList.toggle("mode-3d", m === "3d");
  document.body.classList.toggle("mode-pip", m === "pip");
  $("btnPip").classList.toggle("on", m === "pip");
  $("btn3d").classList.toggle("on", m === "3d");
  if (m === "3d") startGL();
}

const glCanvas = $("gl");
const vWide = $("vWide"), vRoad = $("vRoad"), vDriver = $("vDriver");
let gl, prog, tex = {}, u = {}, view = { yaw: 0, pitch: 0, fov: 70 * Math.PI/180 };
let glOn = false;

const VS = `
attribute vec2 a;
void main(){ gl_Position = vec4(a,0.0,1.0); }
`;
const FS = `
precision highp float;
uniform sampler2D uWide, uRoad, uDriver;
uniform vec2 uRes;
uniform float uYaw, uPitch, uFov;
uniform float uWideH, uRoadH, uDriverH;
uniform float uHasRoad, uHasDriver;

vec2 pinhole(vec3 dir, float hfov, float aspect) {
  float z = dir.z;
  if (z < 0.05) return vec2(-1.0);
  float tanH = tan(hfov * 0.5);
  float tanV = tanH / aspect;
  return vec2(0.5 + (dir.x / z) / (2.0 * tanH), 0.5 - (dir.y / z) / (2.0 * tanV));
}

void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  float tanF = tan(uFov * 0.5);
  vec3 dir = normalize(vec3(ndc.x * tanF, ndc.y * tanF, 1.0));
  float cp = cos(uPitch), sp = sin(uPitch);
  dir = vec3(dir.x, dir.y * cp - dir.z * sp, dir.y * sp + dir.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  dir = vec3(cy * dir.x + sy * dir.z, dir.y, -sy * dir.x + cy * dir.z);

  vec3 col = vec3(0.015);
  if (dir.z > 0.02) {
    vec2 uvw = pinhole(dir, uWideH, 16.0/9.0);
    if (uvw.x > 0.0 && uvw.x < 1.0 && uvw.y > 0.0 && uvw.y < 1.0) {
      col = texture2D(uWide, uvw).rgb;
      if (uHasRoad > 0.5) {
        vec2 uvr = pinhole(dir, uRoadH, 16.0/9.0);
        if (uvr.x > 0.0 && uvr.x < 1.0 && uvr.y > 0.0 && uvr.y < 1.0) {
          float edge = min(min(uvr.x, 1.0 - uvr.x), min(uvr.y, 1.0 - uvr.y));
          float a = smoothstep(0.0, 0.07, edge);
          col = mix(col, texture2D(uRoad, uvr).rgb, a);
        }
      }
    }
  } else if (uHasDriver > 0.5) {
    vec3 back = vec3(-dir.x, dir.y, -dir.z);
    vec2 uvd = pinhole(back, uDriverH, 4.0/3.0);
    if (uvd.x > 0.0 && uvd.x < 1.0 && uvd.y > 0.0 && uvd.y < 1.0)
      col = texture2D(uDriver, uvd).rgb;
  }
  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(g, type, src) {
  const s = g.createShader(type);
  g.shaderSource(s, src); g.compileShader(s);
  if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));
  return s;
}

function startGL() {
  if (glOn) { resize(); return; }
  gl = glCanvas.getContext("webgl", { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) { showErr("WebGL not available"); return; }
  const g = gl;
  prog = g.createProgram();
  g.attachShader(prog, compile(g, g.VERTEX_SHADER, VS));
  g.attachShader(prog, compile(g, g.FRAGMENT_SHADER, FS));
  g.linkProgram(prog);
  if (!g.getProgramParameter(prog, g.LINK_STATUS)) { showErr(g.getProgramInfoLog(prog)); return; }
  g.useProgram(prog);
  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(prog, "a");
  g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  function mkTex(unit, name, vid) {
    const t = g.createTexture();
    g.activeTexture(g.TEXTURE0 + unit);
    g.bindTexture(g.TEXTURE_2D, t);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.uniform1i(g.getUniformLocation(prog, name), unit);
    tex[name] = { t, unit, vid };
  }
  mkTex(0, "uWide", vWide);
  mkTex(1, "uRoad", vRoad);
  mkTex(2, "uDriver", vDriver);
  u.res = g.getUniformLocation(prog, "uRes");
  u.yaw = g.getUniformLocation(prog, "uYaw");
  u.pitch = g.getUniformLocation(prog, "uPitch");
  u.fov = g.getUniformLocation(prog, "uFov");
  u.wideH = g.getUniformLocation(prog, "uWideH");
  u.roadH = g.getUniformLocation(prog, "uRoadH");
  u.driverH = g.getUniformLocation(prog, "uDriverH");
  u.hasRoad = g.getUniformLocation(prog, "uHasRoad");
  u.hasDriver = g.getUniformLocation(prog, "uHasDriver");
  g.uniform1f(u.wideH, WIDE_HFOV);
  g.uniform1f(u.roadH, ROAD_HFOV);
  g.uniform1f(u.driverH, DRIVER_HFOV);
  glOn = true;
  resize();
  requestAnimationFrame(draw);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(glCanvas.clientWidth * dpr);
  const h = Math.floor(glCanvas.clientHeight * dpr);
  if (glCanvas.width !== w || glCanvas.height !== h) {
    glCanvas.width = w; glCanvas.height = h;
  }
  if (gl) gl.viewport(0, 0, w, h);
}

function upload(name) {
  const g = gl, rec = tex[name];
  const v = rec.vid;
  if (!v.videoWidth) return false;
  g.activeTexture(g.TEXTURE0 + rec.unit);
  g.bindTexture(g.TEXTURE_2D, rec.t);
  try { g.texImage2D(g.TEXTURE_2D, 0, g.RGB, g.RGB, g.UNSIGNED_BYTE, v); return true; }
  catch (e) { return false; }
}

function draw() {
  if (mode === "3d" && gl) {
    resize();
    const hasRoad = upload("uRoad");
    const hasDrv = upload("uDriver");
    upload("uWide");
    gl.uniform2f(u.res, glCanvas.width, glCanvas.height);
    gl.uniform1f(u.yaw, view.yaw);
    gl.uniform1f(u.pitch, view.pitch);
    gl.uniform1f(u.fov, view.fov);
    gl.uniform1f(u.hasRoad, hasRoad ? 1 : 0);
    gl.uniform1f(u.hasDriver, hasDrv ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(draw);
}

let dragging = false, lastX = 0, lastY = 0, lastDist = 0;
function onDown(x, y) { dragging = true; lastX = x; lastY = y; }
function onMove(x, y) {
  if (!dragging || mode !== "3d") return;
  view.yaw -= (x - lastX) * 0.005;
  view.pitch += (y - lastY) * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch));
  lastX = x; lastY = y;
}
glCanvas.addEventListener("pointerdown", (e) => { glCanvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY); });
glCanvas.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
glCanvas.addEventListener("pointerup", () => { dragging = false; });
glCanvas.addEventListener("pointercancel", () => { dragging = false; });
glCanvas.addEventListener("wheel", (e) => {
  view.fov *= (e.deltaY > 0) ? 1.08 : 0.92;
  view.fov = Math.max(18*Math.PI/180, Math.min(100*Math.PI/180, view.fov));
  e.preventDefault();
}, { passive: false });
glCanvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    lastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });
glCanvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastDist) {
      view.fov *= lastDist / d;
      view.fov = Math.max(18*Math.PI/180, Math.min(100*Math.PI/180, view.fov));
    }
    lastDist = d;
    dragging = false;
  }
}, { passive: true });

window.addEventListener("resize", resize);

async function waitPlaylist(cam, tries = 40) {
  for (let i = 0; i < tries; i++) {
    const r = await fetch("/hls/" + cam + ".m3u8", { cache: "no-store" });
    if (r.ok) {
      const t = await r.text();
      if (t.includes("#EXTINF")) return true;
    }
    await new Promise((res) => setTimeout(res, 400));
  }
  return false;
}

(async () => {
  try {
    status("starting cameras");
    await watch();
    status("waiting for encoder");
    const ok = await waitPlaylist("wide");
    if (!ok) throw new Error("Encoder did not produce video. Stay on Wi-Fi and retry.");
    attach(vWide, "wide");
    attach(vDriver, "driver");
    attach(vRoad, "road");
    status("live");
    setInterval(() => fetch("/watch", { method: "POST" }).catch(() => {}), 15000);
  } catch (e) {
    status("error");
    showErr(e.message || String(e));
  }
})();
</script>
</body>
</html>
