<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>DELAMAIN Live</title>
<style>
  :root { color-scheme: dark; --fg: #f2f2f2; --muted: rgba(255,255,255,.62); --line: rgba(255,255,255,.12); --blue: #3e8ceb; --gold: #d4b36a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; min-height: 100dvh; background: #000; color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { overflow: hidden; }
  button { appearance: none; font: inherit; color: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; }
  .hero {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(1.05) contrast(1.05);
  }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, #0000 20%, #000c 78%, #000 100%); }
  .copy {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  }
  .kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  h1 { margin: 8px 0 10px; font-size: clamp(28px, 7vw, 44px); font-weight: 650; letter-spacing: .04em; }
  .sub { margin: 0; max-width: 28em; font-size: 15px; line-height: 1.45; color: var(--muted); }
  .enter {
    margin-top: 18px; border: 0; background: #fff; color: #111; border-radius: 999px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; letter-spacing: .04em;
  }
  .enter.ghost { background: transparent; color: #fff; border: 1px solid var(--line); }
  #boot, #off { display: none; }
  body.boot #boot, body.off #off { display: block; }
  body.live #live { display: block; }
  #live { display: none; background: #000; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  video { background: #000; }
  #vWide { width: 100%; height: 100%; object-fit: contain; }
  #vDriver {
    position: absolute; right: max(12px, env(safe-area-inset-right));
    bottom: calc(86px + env(safe-area-inset-bottom));
    width: min(34vw, 220px); aspect-ratio: 4/3; object-fit: cover;
    border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 10px 32px rgba(0,0,0,.55);
  }
  @media (orientation: portrait) {
    #vDriver { width: min(42vw, 200px); }
  }
  #vRoad { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: none; z-index: 1; }
  body.mode-3d #vWide, body.mode-3d #vDriver, body.mode-3d #vRoad {
    inset: 0; width: 100%; height: 100%; opacity: 0.02; pointer-events: none; object-fit: contain;
  }
  body.mode-3d #gl { display: block; }
  #bar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: linear-gradient(#000c, #0000);
    display: flex; flex-direction: column; gap: 6px;
  }
  #bar .row { display: flex; align-items: center; gap: 10px; }
  #bar b { font-weight: 700; letter-spacing: .2em; font-size: 13px; }
  #bar .sp { flex: 1; }
  #st { opacity: .7; font-variant-numeric: tabular-nums; font-size: 12px; }
  #stats {
    display: flex; flex-wrap: wrap; gap: 10px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: .06em; color: var(--muted);
  }
  #stats span { white-space: nowrap; }
  #stats .bars { color: var(--fg); letter-spacing: .12em; }
  #modes {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center; gap: 10px;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(#0000, #000c);
  }
  #modes button {
    border: 1px solid var(--line); background: #141414cc; color: #fff;
    border-radius: 999px; padding: 10px 18px; font-size: 15px;
    backdrop-filter: blur(8px);
  }
  #modes button.on { background: var(--blue); border-color: var(--blue); }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom));
    text-align: center; font-size: 12px; opacity: .45; pointer-events: none; display: none; }
  body.mode-3d #hint { display: block; }
  #err { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; z-index: 6; background: #000a; }
  #err.show { display: grid; }
</style>
</head>
<body class="boot">
<section id="boot" class="screen">
  <img class="hero" src="/static/welcome.jpg" alt=""/>
  <div class="veil"></div>
  <div class="copy">
    <div class="kicker">DELAMAIN</div>
    <h1>Welcome to the livestream</h1>
    <p class="sub">Wide cam up front. Driver cam in the corner. 3D if you want to look around.</p>
    <button class="enter" id="enter" type="button">Enter</button>
  </div>
</section>
<section id="off" class="screen">
  <img class="hero" src="/static/offair.jpg" alt=""/>
  <div class="veil"></div>
  <div class="copy">
    <div class="kicker">DELAMAIN</div>
    <h1>Sorry — On-Air is off</h1>
    <p class="sub" id="offMsg">Enable On-Air on the device (home footer, or Settings → livestream). Same Wi-Fi. Then reload.</p>
    <button class="enter ghost" id="retry" type="button">Check again</button>
  </div>
</section>
<section id="live" class="screen">
  <div id="stage">
    <video id="vWide" playsinline webkit-playsinline muted autoplay></video>
    <video id="vDriver" playsinline webkit-playsinline muted autoplay></video>
    <video id="vRoad" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
  </div>
  <div id="bar">
    <div class="row"><b>DELAMAIN</b><span class="sp"></span><span id="st">starting…</span></div>
    <div id="stats"></div>
  </div>
  <div id="hint">drag to look around · pinch to zoom</div>
  <div id="modes">
    <button id="btnPip" class="on" type="button">PiP</button>
    <button id="btn3d" type="button">3D</button>
  </div>
  <div id="err"></div>
</section>
<script>
const WIDE_HFOV = 119 * Math.PI/180;
const ROAD_HFOV = 40 * Math.PI/180;
const DRIVER_HFOV = 119 * Math.PI/180;
const $ = (id) => document.getElementById(id);
const st = $("st");
const errBox = $("err");
function status(t) { st.textContent = t; }
function showErr(t) { errBox.textContent = t; errBox.classList.add("show"); }
function bars(n) {
  const v = Math.max(0, Math.min(4, n|0));
  return "▂▄▆█".slice(0, Math.max(1, v)) + "·".repeat(4 - Math.max(1, v));
}
function paintStats(info) {
  const bits = [];
  if (info.tempC != null) bits.push(`TEMP ${info.tempC}°`);
  if (info.memPct != null) bits.push(`MEM ${info.memPct}%`);
  if (info.kbps) bits.push(`${info.kbps} kbps`);
  if (info.hlsSegs) bits.push(`SEG ${info.hlsSegs.wide || 0}`);
  if (info.hlsFrames) bits.push(`FR ${info.hlsFrames.wide || 0}`);
  bits.push(`<span class="bars">${(info.network || "net").toUpperCase()} ${bars(info.wifiBars)}</span>`);
  if (info.viewers != null) bits.push(`${info.viewers} watching`);
  $("stats").innerHTML = bits.map((b) => `<span>${b}</span>`).join("");
}
async function getInfo() {
  const r = await fetch("/info", { cache: "no-store" });
  if (!r.ok) throw new Error("device unreachable");
  return r.json();
}
async function watch() {
  const r = await fetch("/watch", { method: "POST" });
  if (!r.ok) throw new Error(await r.text() || r.statusText);
}
function attach(video, cam) {
  video.src = "/hls/" + cam + ".m3u8?t=" + Date.now();
  video.muted = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.autoplay = true;
  const play = () => video.play().catch(() => {});
  video.addEventListener("canplay", play);
  video.addEventListener("loadedmetadata", () => {
    if (video === vWide && video.videoWidth)
      status("live · " + video.videoWidth + "×" + video.videoHeight);
  });
  video.addEventListener("error", () => {
    if (video === vWide) status("decode error — tap video");
  });
  video.load();
  play();
}
function nudgeLive(v) {
  try {
    const b = v.seekable;
    if (!b.length) return;
    const end = b.end(b.length - 1);
    if (end - v.currentTime > 0.7) v.currentTime = Math.max(0, end - 0.2);
  } catch (e) {}
}
let mode = "pip";
$("btnPip").onclick = () => setMode("pip");
$("btn3d").onclick = () => setMode("3d");
function setMode(m) {
  mode = m;
  document.body.classList.toggle("mode-3d", m === "3d");
  document.body.classList.toggle("mode-pip", m === "pip");
  $("btnPip").classList.toggle("on", m === "pip");
  $("btn3d").classList.toggle("on", m === "3d");
  if (m === "3d") startGL();
}
const glCanvas = $("gl");
const vWide = $("vWide"), vRoad = $("vRoad"), vDriver = $("vDriver");
let gl, prog, tex = {}, u = {}, view = { yaw: 0, pitch: 0.04, fov: 95 * Math.PI/180 };
let glOn = false;
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const FS = `
precision highp float;
uniform sampler2D uWide, uRoad, uDriver;
uniform vec2 uRes;
uniform float uYaw, uPitch, uFov;
uniform float uWideH, uRoadH, uDriverH;
uniform float uHasRoad, uHasDriver;

vec2 pinhole(vec3 dir, float hfov, float aspect) {
  float z = dir.z;
  if (z < 0.04) return vec2(-2.0);
  float tanH = tan(hfov * 0.5);
  float tanV = tanH / aspect;
  return vec2(0.5 + (dir.x / z) / (2.0 * tanH), 0.5 - (dir.y / z) / (2.0 * tanV));
}

float inside(vec2 uv) {
  return step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);
}

float edgeW(vec2 uv) {
  float e = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  return smoothstep(0.0, 0.08, e);
}

vec3 matchTo(vec3 src, vec3 ref) {
  float ls = dot(src, vec3(0.299, 0.587, 0.114));
  float lr = dot(ref, vec3(0.299, 0.587, 0.114));
  vec3 n = src * ((lr + 0.04) / (ls + 0.04));
  n = mix(n, ref, 0.12);
  return mix(n, ref, 0.08);
}

void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  ndc.x *= uRes.x / uRes.y;
  float tanF = tan(uFov * 0.5);
  vec3 dir = normalize(vec3(ndc.x * tanF, ndc.y * tanF, 1.0));
  float cp = cos(uPitch), sp = sin(uPitch);
  dir = vec3(dir.x, dir.y * cp - dir.z * sp, dir.y * sp + dir.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  dir = vec3(cy * dir.x + sy * dir.z, dir.y, -sy * dir.x + cy * dir.z);

  vec3 col = vec3(0.02);
  float wgt = 0.0;

  vec2 uvw = pinhole(dir, uWideH, 16.0/9.0);
  float iw = inside(uvw);
  vec3 wideCol = texture2D(uWide, clamp(uvw, 0.0, 1.0)).rgb;
  if (iw > 0.5) {
    col = wideCol;
    wgt = 1.0;
  }

  if (uHasRoad > 0.5) {
    vec3 dirR = dir;
    dirR = normalize(vec3(dirR.x, dirR.y + 0.035 * dirR.z, dirR.z));
    vec2 uvr = pinhole(dirR, uRoadH, 16.0/9.0);
    if (inside(uvr) > 0.5) {
      vec3 roadCol = texture2D(uRoad, uvr).rgb;
      roadCol = matchTo(roadCol, wideCol);
      float a = edgeW(uvr);
      col = mix(col, roadCol, a);
      wgt = 1.0;
    }
  }

  if (uHasDriver > 0.5) {
    vec3 back = vec3(-dir.x, dir.y * 0.96, -dir.z);
    vec2 uvd = pinhole(back, uDriverH, 16.0/9.0);
    float id = inside(uvd);
    vec3 dcol = texture2D(uDriver, clamp(uvd, 0.0, 1.0)).rgb;
    float lookBack = smoothstep(0.08, 0.55, -dir.z);
    float a = max(id * lookBack, lookBack * edgeW(clamp(uvd, 0.0, 1.0)) * (1.0 - iw) * 0.85);
    if (a > 0.01) {
      col = mix(col, dcol, clamp(a, 0.0, 1.0));
      wgt = max(wgt, a);
    }
  }

  if (wgt < 0.5) {
    vec2 uvw2 = clamp(uvw, 0.0, 1.0);
    vec3 back = vec3(-dir.x, dir.y, -dir.z);
    vec2 uvd2 = pinhole(back, uDriverH, 16.0/9.0);
    float useD = smoothstep(-0.15, 0.25, -dir.z);
    vec3 fill = mix(texture2D(uWide, uvw2).rgb, texture2D(uDriver, clamp(uvd2, 0.0, 1.0)).rgb, useD);
    col = mix(fill, col, wgt);
  }

  gl_FragColor = vec4(col, 1.0);
}
`;
function compile(g, type, src) {
  const s = g.createShader(type);
  g.shaderSource(s, src); g.compileShader(s);
  if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));
  return s;
}
function startGL() {
  if (glOn) { resize(); return; }
  gl = glCanvas.getContext("webgl", { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) { showErr("WebGL not available"); return; }
  const g = gl;
  prog = g.createProgram();
  g.attachShader(prog, compile(g, g.VERTEX_SHADER, VS));
  g.attachShader(prog, compile(g, g.FRAGMENT_SHADER, FS));
  g.linkProgram(prog);
  if (!g.getProgramParameter(prog, g.LINK_STATUS)) { showErr(g.getProgramInfoLog(prog)); return; }
  g.useProgram(prog);
  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(prog, "a");
  g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  function mkTex(unit, name, vid) {
    const t = g.createTexture();
    g.activeTexture(g.TEXTURE0 + unit);
    g.bindTexture(g.TEXTURE_2D, t);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.uniform1i(g.getUniformLocation(prog, name), unit);
    tex[name] = { t, unit, vid };
  }
  mkTex(0, "uWide", vWide);
  mkTex(1, "uRoad", vRoad);
  mkTex(2, "uDriver", vDriver);
  u.res = g.getUniformLocation(prog, "uRes");
  u.yaw = g.getUniformLocation(prog, "uYaw");
  u.pitch = g.getUniformLocation(prog, "uPitch");
  u.fov = g.getUniformLocation(prog, "uFov");
  u.wideH = g.getUniformLocation(prog, "uWideH");
  u.roadH = g.getUniformLocation(prog, "uRoadH");
  u.driverH = g.getUniformLocation(prog, "uDriverH");
  u.hasRoad = g.getUniformLocation(prog, "uHasRoad");
  u.hasDriver = g.getUniformLocation(prog, "uHasDriver");
  g.uniform1f(u.wideH, WIDE_HFOV);
  g.uniform1f(u.roadH, ROAD_HFOV);
  g.uniform1f(u.driverH, DRIVER_HFOV);
  glOn = true;
  resize();
  requestAnimationFrame(draw);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(glCanvas.clientWidth * dpr);
  const h = Math.floor(glCanvas.clientHeight * dpr);
  if (glCanvas.width !== w || glCanvas.height !== h) { glCanvas.width = w; glCanvas.height = h; }
  if (gl) gl.viewport(0, 0, w, h);
}
function upload(name) {
  const g = gl, rec = tex[name];
  const v = rec.vid;
  if (!v.videoWidth) return false;
  g.activeTexture(g.TEXTURE0 + rec.unit);
  g.bindTexture(g.TEXTURE_2D, rec.t);
  try { g.texImage2D(g.TEXTURE_2D, 0, g.RGB, g.RGB, g.UNSIGNED_BYTE, v); return true; }
  catch (e) { return false; }
}
function draw() {
  if (mode === "3d" && gl) {
    resize();
    const hasRoad = upload("uRoad");
    const hasDrv = upload("uDriver");
    upload("uWide");
    gl.uniform2f(u.res, glCanvas.width, glCanvas.height);
    gl.uniform1f(u.yaw, view.yaw);
    gl.uniform1f(u.pitch, view.pitch);
    gl.uniform1f(u.fov, view.fov);
    gl.uniform1f(u.hasRoad, hasRoad ? 1 : 0);
    gl.uniform1f(u.hasDriver, hasDrv ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(draw);
}
let dragging = false, lastX = 0, lastY = 0, lastDist = 0;
function onDown(x, y) { dragging = true; lastX = x; lastY = y; }
function onMove(x, y) {
  if (!dragging || mode !== "3d") return;
  view.yaw -= (x - lastX) * 0.005;
  view.pitch += (y - lastY) * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch));
  lastX = x; lastY = y;
}
glCanvas.addEventListener("pointerdown", (e) => { glCanvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY); });
glCanvas.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
glCanvas.addEventListener("pointerup", () => { dragging = false; });
glCanvas.addEventListener("pointercancel", () => { dragging = false; });
glCanvas.addEventListener("wheel", (e) => {
  view.fov *= (e.deltaY > 0) ? 1.08 : 0.92;
  view.fov = Math.max(18*Math.PI/180, Math.min(100*Math.PI/180, view.fov));
  e.preventDefault();
}, { passive: false });
glCanvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    lastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });
glCanvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastDist) {
      view.fov *= lastDist / d;
      view.fov = Math.max(18*Math.PI/180, Math.min(100*Math.PI/180, view.fov));
    }
    lastDist = d;
    dragging = false;
  }
}, { passive: true });
window.addEventListener("resize", resize);
async function waitPlaylist(cam, tries = 50) {
  for (let i = 0; i < tries; i++) {
    const r = await fetch("/hls/" + cam + ".m3u8", { cache: "no-store" });
    const t = r.ok ? await r.text() : "";
    const n = (t.match(/#EXTINF/g) || []).length;
    status("encoder · " + n + " segments");
    if (n >= 1) return true;
    await new Promise((res) => setTimeout(res, 400));
  }
  return false;
}
function show(which) {
  document.body.classList.remove("boot", "off", "live");
  document.body.classList.add(which);
}
function offCopy(info) {
  if (info && info.reason === "network")
    return "This viewer is Wi-Fi only. Join the same network as the device, then reload.";
  return "Enable On-Air on the device — tap the badge on the home screen, or Settings → livestream. Same Wi-Fi. Then reload.";
}
async function goLive() {
  show("live");
  document.body.classList.add("mode-pip");
  try {
    status("starting cameras");
    await watch();
    status("waiting for encoder");
    const ok = await waitPlaylist("wide");
    if (!ok) throw new Error("Encoder did not produce video. Stay on Wi-Fi and retry.");
    attach(vWide, "wide");
    attach(vDriver, "driver");
    attach(vRoad, "road");
    status("live");
    vWide.addEventListener("click", () => vWide.play().catch(() => {}));
    const tick = async () => {
      try { paintStats(await getInfo()); } catch (e) {}
      nudgeLive(vWide); nudgeLive(vDriver); nudgeLive(vRoad);
    };
      try { paintStats(await getInfo()); } catch (e) {}
    };
    tick();
    setInterval(tick, 2000);
    setInterval(() => fetch("/watch", { method: "POST" }).catch(() => {}), 15000);
  } catch (e) {
    status("error");
    showErr(e.message || String(e));
  }
}
async function boot() {
  let info = null;
  try { info = await getInfo(); } catch (e) { info = null; }
  if (info) paintStats(info);
  if (!info || !info.onAir || !info.networkOk || info.metered) {
    $("offMsg").textContent = offCopy(info || { reason: "onair" });
    show("off");
    return;
  }
  show("boot");
}
$("enter").onclick = () => goLive();
$("retry").onclick = () => boot();
boot();
</script>
</body>
</html>
